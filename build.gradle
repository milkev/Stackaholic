plugins {
	id 'fabric-loom' version '1.14.10'
	id 'maven-publish'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

base {
	archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	//Because sometimes the world hates me and i need to load dependencies without a repository or link
	flatDir {
		dirs 'build/loom-cache'
	}
	//cloth config
	maven { url "https://maven.shedaniel.me/" }
}

dependencies {
	//to change the versions see the gradle.properties file
	//minecraft version
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	//yarn mappings
	mappings "net.fabricmc:yarn:${project.yarn_mappings}"
	//fabric loader
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	//fabric api
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "com.notunanancyowen.mait:mob-ai-tweaks:${project.mait_version}"
	//config api
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	inputs.property "version", project.version

	from(sourceSets.main.resources.srcDirs) {
		include "fabric.mod.json"
		expand "version": project.version
	}

	from(sourceSets.main.resources.srcDirs) {
		exclude "fabric.mod.json"
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

//fixes problem i had with intellij and gradle
tasks {
	processResources {
		setDuplicatesStrategy('include')
	}
}

jar {
	from "LICENSE"
}

fabricApi {
	configureDataGeneration()
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(remapJar) {
				builtBy remapJar
			}
			artifact(sourcesJar) {
				builtBy remapSourcesJar
			}
		}
	}

	// select the repositories you want to publish to
}
